<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EOI Tracker — 해외사업 공고 취합</title>
<style>
  :root{
    --bg:#f7f8fa;
    --surface:#ffffff;
    --ink:#1a1d23;
    --ink-soft:#5b6270;
    --border:#e5e7eb;
    --primary:#2563eb;
    --primary-soft:#eff4ff;
    --eoi:#d97706;
    --eoi-soft:#fef3e2;
    --sans: "Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:28px 32px 24px;
  }
  header .eyebrow{
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--primary);
  }
  header h1{
    margin:6px 0 6px;
    font-weight:700;
    font-size:26px;
    letter-spacing:-0.02em;
    color:var(--ink);
  }
  header .sub{
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .meta-bar{
    max-width:1100px;
    margin:0 auto;
    padding:14px 32px 0;
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    align-items:baseline;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .meta-bar b{color:var(--ink); font-weight:600;}
  main{max-width:1100px;margin:0 auto;padding:20px 32px 60px;}
  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    margin-bottom:20px;
    box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .toolbar input, .toolbar select{
    font-family:var(--sans);
    font-size:13.5px;
    padding:9px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
  }
  .toolbar input:focus, .toolbar select:focus{
    outline:none; border-color:var(--primary);
  }
  .toolbar input[type="text"]{flex:1 1 220px;}
  .toolbar select{flex:0 0 auto;}
  .count-pill{
    font-size:12.5px;
    font-weight:600;
    align-self:center;
    color:var(--primary);
    margin-left:auto;
    white-space:nowrap;
  }
  .grid{display:flex; flex-direction:column; gap:8px;}
  .row-card{
    display:grid;
    grid-template-columns: 96px 190px 100px 1fr 130px;
    gap:16px;
    align-items:start;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    box-shadow:0 1px 2px rgba(16,24,40,.04);
    transition:box-shadow .15s, border-color .15s;
    overflow:hidden;
  }
  .row-card:hover{box-shadow:0 4px 12px rgba(16,24,40,.08); border-color:#d7dae0;}
  .row-head{
    display:grid; grid-template-columns: 96px 190px 100px 1fr 130px; gap:16px;
    padding:0 16px 6px; font-size:11px; font-weight:700; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.03em;
  }
  .col-source{font-size:12px; color:var(--ink-soft); font-weight:600; padding-top:2px;}
  .col-title-block .title-link{
    font-size:14.5px; font-weight:700; color:var(--ink); text-decoration:none; line-height:1.4;
  }
  .col-title-block .title-link:hover{color:var(--primary); text-decoration:underline;}
  .col-title-block .desc-line{
    display:block; font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-top:4px;
  }
  .col-title-block .meta-row{margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;}
  .meta-chip{
    font-size:11px; color:var(--ink-soft); background:#f3f4f6; border-radius:6px;
    padding:2px 8px; white-space:nowrap;
  }
  .col-date{font-size:12px; color:var(--ink-soft); line-height:1.6;}
  .col-date .deadline{color:var(--primary); font-weight:700;}
  .tag{
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:999px;
    background:var(--primary-soft);
    color:var(--primary);
    text-transform:uppercase;
    letter-spacing:.02em;
    display:inline-block;
    line-height:1.4;
  }
  .tag.eoi{background:var(--eoi-soft); color:var(--eoi);}
  .country{font-size:12.5px; color:var(--ink-soft); padding-top:2px;}
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
    font-size:14.5px; border:1px dashed var(--border); border-radius:12px; background:var(--surface);
  }
  @media (max-width:820px){
    .row-head{display:none;}
    .row-card{grid-template-columns:1fr; gap:6px;}
  }
  footer{
    max-width:1100px; margin:0 auto; padding:0 32px 40px;
    font-size:11.5px; color:#a1a7b0;
  }
  @media (max-width:600px){
    header{padding:20px;}
    main{padding:16px;}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Dasan Consultants · Overseas Project</div>
  <h1>EOI / 제안서 공고 취합 대시보드</h1>
  <div class="sub">국내외 발주기관 공고를 매일 자동 수집합니다 (대상 사이트 순차 확대 중)</div>
</header>

<div class="meta-bar">
  <span>최근 업데이트: <b id="generatedAt">-</b></span>
  <span>수집 소스: <b id="sourcesDesc">-</b></span>
  <span>전체 <b id="totalCount">0</b>건</span>
</div>

<main>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="프로젝트명, 국가, 키워드 검색...">
    <select id="sourceFilter">
      <option value="">전체 출처</option>
    </select>
    <select id="typeFilter">
      <option value="">전체 공고유형</option>
    </select>
    <select id="countryFilter">
      <option value="">전체 국가</option>
    </select>
    <span class="count-pill" id="filteredCount"></span>
  </div>

  <div class="grid" id="grid"></div>
</main>

<footer>
  매일 KST 06:00 자동 갱신 (GitHub Actions) · 수집 소스는 상단 참고
</footer>

<script>
async function loadData(){
  const grid = document.getElementById('grid');
  try{
    const res = await fetch('data/notices.json?_=' + Date.now());
    const data = await res.json();
    render(data);
  }catch(e){
    grid.innerHTML = '<div class="empty-state">데이터를 불러오지 못했습니다. 첫 자동 수집이 아직 실행되지 않았을 수 있습니다.</div>';
  }
}

let ALL = [];

function render(data){
  document.getElementById('generatedAt').textContent = data.generated_at
    ? new Date(data.generated_at).toLocaleString('ko-KR', {timeZone:'Asia/Seoul'}) + ' (KST)'
    : '아직 수집 전';
  document.getElementById('sourcesDesc').textContent = (data.sources || []).join(' · ') || '-';
  document.getElementById('totalCount').textContent = data.count ?? 0;

  ALL = data.notices || [];

  const typeSel = document.getElementById('typeFilter');
  const countrySel = document.getElementById('countryFilter');
  const sourceSel = document.getElementById('sourceFilter');
  const types = [...new Set(ALL.map(n => n.notice_type).filter(Boolean))].sort();
  const countries = [...new Set(ALL.map(n => n.country).filter(Boolean))].sort();
  const sourceList = [...new Set(ALL.map(n => n.source).filter(Boolean))].sort();
  typeSel.innerHTML = '<option value="">전체 공고유형</option>' + types.map(t => `<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join('');
  countrySel.innerHTML = '<option value="">전체 국가</option>' + countries.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('');
  sourceSel.innerHTML = '<option value="">전체 출처</option>' + sourceList.map(s => `<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`).join('');

  applyFilters();
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function applyFilters(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const type = document.getElementById('typeFilter').value;
  const country = document.getElementById('countryFilter').value;
  const source = document.getElementById('sourceFilter').value;

  const filtered = ALL.filter(n => {
    if (type && n.notice_type !== type) return false;
    if (country && n.country !== country) return false;
    if (source && n.source !== source) return false;
    if (q){
      const hay = [n.project_name, n.country, n.bid_description, n.notice_type, n.bid_reference_no]
        .join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('filteredCount').textContent = `${filtered.length} / ${ALL.length}건 표시`;
  renderGrid(filtered);
}

function renderGrid(items){
  const grid = document.getElementById('grid');
  if (items.length === 0){
    grid.innerHTML = '<div class="empty-state">조건에 맞는 공고가 없습니다.</div>';
    return;
  }

  const head = `
    <div class="row-head">
      <span>출처</span>
      <span>유형</span>
      <span>국가</span>
      <span>제목</span>
      <span>일정</span>
    </div>`;

  const rows = items.map((n) => {
    const isEoi = (n.notice_type || '').toLowerCase().includes('expression of interest');

    const chips = [];
    if (n.bid_reference_no) chips.push(`<span class="meta-chip">Ref. ${escapeHtml(n.bid_reference_no)}</span>`);
    if (n.procurement_method) chips.push(`<span class="meta-chip">${escapeHtml(n.procurement_method)}</span>`);
    const metaRow = chips.length ? `<div class="meta-row">${chips.join('')}</div>` : '';
    const descLine = n.bid_description ? `<span class="desc-line">${escapeHtml(n.bid_description)}</span>` : '';

    const dateBits = [];
    if (n.notice_date) dateBits.push(`게시 ${escapeHtml(n.notice_date)}`);
    if (n.submission_date) dateBits.push(`<span class="deadline">마감 ${escapeHtml(n.submission_date)}</span>`);
    const dateBlock = dateBits.length ? dateBits.join('<br>') : '-';

    return `
    <div class="row-card">
      <div class="col-source">${escapeHtml(n.source || '-')}</div>
      <div><span class="tag ${isEoi ? 'eoi' : ''}">${escapeHtml(n.notice_type || '기타')}</span></div>
      <div class="country">${escapeHtml(n.country || '-')}</div>
      <div class="col-title-block">
        <a class="title-link" href="${n.source_url}" target="_blank" rel="noopener">${escapeHtml(n.project_name || '(프로젝트명 없음)')}</a>
        ${descLine}
        ${metaRow}
      </div>
      <div class="col-date">${dateBlock}</div>
    </div>`;
  }).join('');

  grid.innerHTML = head + rows;
}

function toggleCard(i){
  document.getElementById('card-' + i).classList.toggle('open');
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('typeFilter').addEventListener('change', applyFilters);
document.getElementById('countryFilter').addEventListener('change', applyFilters);
document.getElementById('sourceFilter').addEventListener('change', applyFilters);

loadData();
</script>
</body>
</html>
